server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lwl.husteread.com;

    ssl_certificate /etc/letsencrypt/live/lwl.husteread.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lwl.husteread.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /canteen {
        return 301 /canteen/;
    }

    location /canteen/ {
        alias /var/www/hust-tj-canteen/out/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    location /canteen/_next/static/ {
        alias /var/www/hust-tj-canteen/out/_next/static/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Preserve the existing personal site at the domain root.
    location / {
        proxy_ssl_server_name on;
        proxy_set_header Host liwenlong070124-spec.github.io;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass https://liwenlong070124-spec.github.io/Learn-AI-Coding/;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name lwl.husteread.com;
    return 301 https://$host$request_uri;
}
